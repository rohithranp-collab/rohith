[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "taskcraft-todo"
version = "1.0.0"
description = "Full-stack To-Do application built with FastAPI, SQLite, and Vanilla JS Glassmorphism UI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

